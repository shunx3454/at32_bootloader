# CMSIS-DAP over SWD configuration for the AT32F403A used by this project.
#
# Run from any directory with:
#   /home/qxun/Downloads/openocd-at32/bin-linux_x86_64/openocd \
#     -s /home/qxun/Downloads/openocd-at32/scripts \
#     -f /home/qxun/git/at32_usb_dfu/openocd.cfg

# This DAPLink exposes the CMSIS-DAP v2 vendor-specific bulk interface.
source [find interface/cmsis-dap-v2.cfg]
cmsis_dap_vid_pid 0x0d28 0x0204
cmsis_dap_serial 39DD062BDBD95DC46638E18CB5A6672C
transport select swd

# The project uses AT32F403AxG (1 MiB embedded Flash).
set CHIPNAME at32f403axx
set FLASH_SIZE 0x100000
source [find target/at32f403axx.cfg]

# Keep initial communication conservative; raise this after a stable connection.
adapter speed 1000
